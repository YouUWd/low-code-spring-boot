# ===== 开发环境配置 =====

spring:
  # ===== 多数据源配置 =====
  datasource:
    dynamic:
      hikari:
        minimum-idle: 3          # 最小空闲连接数，开发环境设为 1 即可
        maximum-pool-size: 5     # 最大连接数，开发环境单个数据源 3 个绝对够用了
        idle-timeout: 600000     # 空闲连接存活时间（毫秒），10分钟不活动则释放
        max-lifetime: 1800000    # 连接的最大生命周期（毫秒），30分钟
        connection-timeout: 3000
      primary: primary
      datasources:
        # 主数据源 — mysql 无业务使用
        primary:
          url: jdbc:mysql://${DB_PRIMARY_HOST:192.168.60.101}:${DB_PRIMARY_PORT:3306}/${DB_PRIMARY_NAME:mysql}?useUnicode=true&characterEncoding=UTF8
          username: ${DB_PRIMARY_USERNAME:root}
          password: ${DB_PRIMARY_PASSWORD:jdec_platform123}
        # auth_center 数据源
        auth_center:
          url: jdbc:mysql://${DB_AUTH_CENTER_HOST:192.168.60.101}:${DB_AUTH_CENTER_PORT:3306}/${DB_AUTH_CENTER_NAME:auth_center}?useUnicode=true&characterEncoding=UTF8
