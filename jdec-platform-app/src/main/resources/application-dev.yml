# ===== 开发环境配置 =====

spring:
  # ===== 多数据源配置 =====
  datasource:
    dynamic:
      hikari:
        minimum-idle: 3          # 最小空闲连接数，开发环境设为 1 即可
        maximum-pool-size: 5     # 最大连接数，开发环境单个数据源 3 个绝对够用了
        idle-timeout: 600000     # 空闲连接存活时间（毫秒），10分钟不活动则释放
        max-lifetime: 1800000    # 连接的最大生命周期（毫秒），30分钟
        connection-timeout: 3000
      primary: primary
      datasources:
        # 主数据源 — mysql 无业务使用
        primary:
          url: jdbc:mysql://${DB_PRIMARY_HOST:192.168.60.6}:${DB_PRIMARY_PORT:5506}/${DB_PRIMARY_NAME:mysql}?useUnicode=true&characterEncoding=UTF8
          username: ${DB_PRIMARY_USERNAME:root}
          password: ${DB_PRIMARY_PASSWORD:mysql-platform}
        # auth_center 数据源
        auth_center:
          url: jdbc:mysql://${DB_AUTH_CENTER_HOST:192.168.60.6}:${DB_AUTH_CENTER_PORT:5506}/${DB_AUTH_CENTER_NAME:auth_center}?useUnicode=true&characterEncoding=UTF8
          username: ${DB_AUTH_CENTER_USERNAME:root}
          password: ${DB_AUTH_CENTER_PASSWORD:mysql-platform}
        # config_center 数据源
        config_center:
          url: jdbc:mysql://${DB_CONFIG_CENTER_HOST:192.168.60.6}:${DB_CONFIG_CENTER_PORT:5506}/${DB_CONFIG_CENTER_NAME:config_center}?useUnicode=true&characterEncoding=UTF8
          username: ${DB_CONFIG_CENTER_USERNAME:root}
          password: ${DB_CONFIG_CENTER_PASSWORD:mysql-platform}
        # hr_manage 人力平台数据源
        hr_manage:
          url: jdbc:mysql://${DB_HR_MANAGE_HOST:192.168.60.6}:${DB_HR_MANAGE_PORT:5506}/${DB_HR_MANAGE_NAME:hr_manage}?useUnicode=true&characterEncoding=UTF8
          username: ${DB_HR_MANAGE_USERNAME:root}
          password: ${DB_HR_MANAGE_PASSWORD:mysql-platform}
        # third 数据源
        third:
          url: jdbc:mysql://${DB_THIRD_HOST:192.168.60.6}:${DB_THIRD_PORT:5506}/${DB_THIRD_NAME:third}?useUnicode=true&characterEncoding=UTF8
          username: ${DB_THIRD_USERNAME:root}
          password: ${DB_THIRD_PASSWORD:mysql-platform}
        # school 数据源
        school:
          url: jdbc:mysql://${DB_SCHOOL_HOST:192.168.60.6}:${DB_SCHOOL_PORT:5506}/${DB_SCHOOL_NAME:school}?useUnicode=true&characterEncoding=UTF8
          username: ${DB_SCHOOL_USERNAME:root}
          password: ${DB_SCHOOL_PASSWORD:mysql-platform}
  # ===== Redis 配置 =====
  data:
    redis:
      host: ${REDIS_HOST:192.168.60.6}
      port: ${REDIS_PORT:5379}
      password: ${REDIS_PASSWORD:redis-jd-platform}
      database: ${REDIS_DATABASE:8}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

# ===== 项目-数据源映射 =====
jdec:
  project:
    datasource-mapping:
      primary: primary
      school: school
      hr_manage: hr_manage
      config_center: config_center

# ===== MyBatis-Plus 开发模式 =====
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ===== 日志配置 =====
logging:
  level:
    com.jdec.platform: DEBUG
    org.springframework.modulith: DEBUG
# ===== Sa-Token 配置 =====
sa-token:
  # 打印操作日志
  is-log: true
  # Token 有效期（秒），-1 为永不过期
  timeout: 86400
  # Token 临时有效期（秒）
  active-timeout: -1
  # 是否允许同一账号多地同时登录
  is-concurrent: true
  # Token 风格：uuid | simple-uuid | random-32 | random-64 | random-128 | tik
  token-style: random-128
  # SSO 配置
  sso-server:
    # Ticket 有效期（秒）
    ticket-timeout: 300
    # 允许的回调地址（正则，多个逗号分隔）
    allow-url: "*"
    # 是否打开单点注销功能
    is-slo: true
sso:
  login-page-url: http://localhost:3000/sso/login

# knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: 实体类
