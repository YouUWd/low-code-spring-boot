# ===== 项目-数据源映射 =====
jdec:
  project:
    datasource-mapping:
      primary: primary
      auth_center: auth_center
      config_center: config_center
      hr_manage: hr_manage
      third: third
      school: school

# ===== MyBatis-Plus 测试模式 =====
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ===== 日志配置 =====
logging:
  level:
    com.jdec.platform: INFO
    org.springframework.modulith: INFO

# ===== Sa-Token 配置 =====
sa-token:
  # 打印操作日志
  is-log: false
  # Token 有效期（秒），-1 为永不过期
  timeout: 86400
  # Token 临时有效期（秒）
  active-timeout: -1
  # 是否允许同一账号多地同时登录
  is-concurrent: true
  # Token 风格：uuid | simple-uuid | random-32 | random-64 | random-128 | tik
  token-style: random-128
  # SSO 配置
  sso-server:
    # Ticket 有效期（秒）
    ticket-timeout: 300
    # 允许的回调地址（正则，多个逗号分隔）
    allow-url: "*"
    # 是否打开单点注销功能
    is-slo: true
sso:
  login-page-url: http://119.36.78.123:3000/sso/login

# knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: 实体类

