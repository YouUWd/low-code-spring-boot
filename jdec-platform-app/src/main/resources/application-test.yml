# ===== 测试环境配置 (Test Profile) =====

spring:
  # ===== 多数据源配置 =====
  datasource:
    dynamic:
      hikari:
        minimum-idle: 3          # 最小空闲连接数
        maximum-pool-size: 10    # 测试环境最大连接数
        idle-timeout: 600000     # 空闲连接存活时间（毫秒），10分钟不活动则释放
        max-lifetime: 1800000    # 连接的最大生命周期（毫秒），30分钟
        connection-timeout: 5000 # 连接超时时间（毫秒）
      primary: primary
      datasources:
        # 主数据源 — mysql 无业务使用
